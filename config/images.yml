version: 1

defaults:
  registry: ghcr.io/laraoci
  user:
    name: laravel
    uid: 1000
    gid: 1000
  workdir: /var/www/html
  debian: trixie
  platforms:
    - linux/amd64
    - linux/arm64
  # NATIVE RUNNER PER BUILD PLATFORM (D3a). A full arm64 PHP-extension build
  # under QEMU is the cost D3a exists to avoid, so the release matrix puts each
  # platform on its own hardware and bin/matrix.sh reads the pairing from here.
  #
  # A platform absent from this map is a HARD ERROR in bin/matrix.sh rather than
  # a fallback to ubuntu-latest: the fallback would build the arm64 leg under
  # emulation and publish it under a name that says otherwise - green, slow, and
  # wrong in the one way no test downstream can see.
  #
  # Pinned to -24.04 on BOTH sides, not -latest: a runner-image rollover that
  # moved only one architecture would silently split the matrix across two
  # toolchains mid-release.
  runners:
    linux/amd64: ubuntu-24.04
    linux/arm64: ubuntu-24.04-arm

php:
  # Exactly one version carries `default: true`; it backs :latest.
  # `status` is `supported` | `deprecated`; only `supported` is built.
  #
  # `deprecated_on: YYYY-MM-DD` accompanies `status: deprecated` and is the date
  # the rolling tag FROZE. It is not decoration: §13 requires the freeze date to
  # be stated, bin/docs-gen.sh renders it into the README and the docs site, and
  # without it "this tag is frozen" gives a consumer no way to tell how stale the
  # image behind it is. Both keys are set together by bin/deprecate.sh, which
  # refuses the transitions that would deliver only some of §13's three effects.
  #
  # A per-version `debian:` key here would OVERRIDE defaults.debian - it is the
  # trixie-transition mechanism, NOT a product axis. Absent in normal
  # operation; present only while migrating a single version off an ageing OS.
  "8.3":
    status: supported
  "8.4":
    status: supported
    default: true
  "8.5":
    status: supported

extensions:
  # The twelve-extension core set. Uniform across all three PHP
  # versions - install-php-extensions supports every one on 5.5-8.5.
  core:
    - bcmath
    - exif
    - gd
    - imagick
    - intl
    - opcache
    - pcntl
    - pdo_mysql
    - pdo_pgsql
    - redis
    - sockets
    - zip

size_budgets:
  # Compressed MB, measured by bin/size-check.sh (D17). ADVISORY on PRs, which
  # run `--report` and always exit 0; the enforcing form (no --report, exit 1 on
  # overrun) is wired into the release path in M4 per spec §9.2.
  #
  # ALL SIX are MEASURED, not guesses - no placeholder survives. One formula for
  # all of them, so the numbers stay comparable across milestones:
  #
  #   ceil(max(8.3, 8.4, 8.5) x 1.10 / 5) x 5
  #
  # The 10% headroom absorbs Debian package drift between the weekly rebuilds
  # (§9.3); the rounding to 5 MB keeps the committed number readable. Frozen per
  # D17. Size grows monotonically with the PHP minor on every image measured so
  # far, so 8.5 sets each budget and a future 8.6 should be expected to raise it.
  #
  #   image     date        arch          8.3      8.4      8.5   -> budget
  #   runtime   2026-07-27  linux/amd64  227.6    230.5    232.6     260
  #   cli       2026-07-28  linux/amd64  227.55   230.53   232.62    260
  #   fpm       2026-07-28  linux/amd64  228.02   230.99   233.08    260
  #   builder   2026-08-11  linux/amd64  307.22   310.19   312.29    345
  #   queue     2026-07-31  linux/amd64  227.58   230.55   232.66    260
  #   scheduler 2026-07-31  linux/amd64  227.57   230.55   232.66    260
  #
  # BOTH ARCHITECTURES ARE NOW MEASURED, and the arch column above still reads
  # linux/amd64 because amd64 is the LARGER one on every image - by a
  # near-constant 11.06-11.50 MB, measured natively on ubuntu-24.04-arm, no
  # emulation (D3a). A budget is one scalar covering both legs, so the larger
  # architecture sets it, and arm64 enforcement therefore added no new risk.
  # The eighteen arm64 figures are in docs/size-report-m4.md.
  #
  # builder's row is the ONE re-freeze in M4: 330 -> 345, on 2026-08-11. It did
  # not fail - 312.29 against 330 passed with room - but D42's npm 12.0.2
  # upgrade added a flat +13.19 MB (consistent to 0.01 MB across all three
  # versions, which is what identifies it as a fixed addition rather than
  # drift), leaving 5.7% headroom where the formula intends 10%. Re-frozen BY
  # THE FORMULA rather than nudged to the smallest passing value: fitting a
  # budget to the build is how the margin that absorbs Debian drift between
  # weekly rebuilds (§9.3) gets spent without anyone deciding to spend it.
  #
  # runtime's three numbers and the Ghostscript/-extra deltas behind them are in
  # docs/size-report-m1.md; cli's, fpm's and builder's nine, and what each image
  # adds over its parent, are in docs/size-report-m2.md. The six above them -
  # queue's and scheduler's - belong to the M3 report. All 36 of M4's, both
  # architectures, are in docs/size-report-m4.md.
  #
  # FIVE OF THE SIX LANDING ON runtime's OWN 260 IS THE CORRECT OUTCOME, not a
  # copy-paste error. cli adds ENV and CMD - zero bytes, and its measurements
  # differ from runtime's only in the third significant figure. fpm adds
  # libfcgi-bin, libfcgi0t64 and one rendered pool file, together about 0.5 MB
  # compressed. queue adds one ENV and one CMD over cli, and scheduler adds a CMD
  # alone; both measure IDENTICALLY to cli on the same day -
  #
  #   cli        227.58   230.56   232.66
  #   queue      227.58   230.55   232.66
  #   scheduler  227.57   230.55   232.66
  #
  # - where the one-hundredth-MB disagreements are gzip noise, not content. All
  # are far inside the rounding step, so they round identically. The placeholders
  # these replaced (225 and 235) were below the parent they descend from, which
  # is impossible by construction; that impossibility is what made them fail
  # loudly the moment each image was first built, exactly as intended.
  #
  # cli's row above is M2's frozen measurement and is deliberately NOT rewritten.
  # Re-measured on 2026-07-31 it reads 0.03-0.04 MB higher, because D30 added the
  # preload script to `runtime` and every descendant carries it. That is three
  # orders of magnitude inside the 5 MB rounding step and moves no budget; the
  # M3 size report carries the re-measurement rather than this file.
  runtime: 260
  cli: 260
  fpm: 260
  builder: 345
  queue: 260
  scheduler: 260

images:
  # `parent` defines build order; CI topologically sorts (no hand-maintained
  # ordering). The graph is single-rooted at `runtime`:
  # runtime -> cli, fpm, builder ; cli -> queue, scheduler
  runtime:
    dockerfile: images/runtime/Dockerfile
    description: Shared base layer for LaraOCI Laravel images - PHP extensions, hardened ImageMagick policy, non-root user, tuned ini.
  cli:
    parent: runtime
    dockerfile: images/cli/Dockerfile
    description: Laravel artisan commands, migrations and one-off tasks.
  fpm:
    parent: runtime
    dockerfile: images/fpm/Dockerfile
    exposes: [9000]
    # php-fpm reads SIGQUIT as "drain, then exit" and SIGTERM as "die now" - the
    # opposite of the CLI images, which trap SIGTERM through pcntl. runtime sets
    # SIGTERM because that suits most of the graph, so fpm must set this back or
    # every container is killed mid-request on stop (§6.2, M2 trap 1).
    #
    # It lives here rather than only in the Dockerfile because
    # container-structure-test cannot assert a stop signal - its metadataTest
    # schema has no such field, and a container cannot read its own - so
    # .github/workflows/build.yml checks the built image against this key.
    # Absent means SIGTERM, which is what every other image inherits.
    stopsignal: SIGQUIT
    description: PHP-FPM for Laravel, to be run behind Nginx, Caddy or Traefik.
  builder:
    parent: runtime
    dockerfile: images/builder/Dockerfile
    description: Composer and Node build toolchain for multi-stage builds. NOT for production runtime.
  queue:
    parent: cli
    dockerfile: images/queue/Dockerfile
    description: Laravel queue worker with graceful SIGTERM shutdown.
  scheduler:
    parent: cli
    dockerfile: images/scheduler/Dockerfile
    description: Laravel scheduler - run exactly one replica.

