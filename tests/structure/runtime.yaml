schemaVersion: '2.0.0'

# What `runtime` adds to, or is the reference implementation of, the inherited
# contract. The bulk of spec §6 moved to tests/structure/_common.yaml when M2
# added sibling images, so that every assertion runs on every descendant rather
# than only here; bin/structure-test.sh runs both files on this leg, so nothing
# stopped being asserted about this image.
#
# What is left is what is TRUE OF runtime AND NOT OF ITS CHILDREN.

metadataTest:
  cmd: ["php", "-v"]
  envVars:
    # 🧭 1. Not a §6.4 default but a mechanism: laraoci-entrypoint reads it for
    # the binary a dash-first argument means AND for the preload gate. php-fpm
    # is right here (D18) and is what cli/queue/scheduler/builder override. If
    # this ever silently becomes `php` on runtime, `docker run <runtime> -v`
    # stops starting FPM and the M1 behaviour changes under everyone.
    - key: LARAOCI_DEFAULT_BINARY
      value: php-fpm
    # The fpm column of §6.4. cli and builder override both to 512M / 0.
    - key: PHP_MEMORY_LIMIT
      value: 256M
    - key: PHP_MAX_EXECUTION_TIME
      value: "30"

fileExistenceTests:
  # Not in _common.yaml, because `builder` legitimately ships Composer (§7.4).
  # Every other image in the graph re-asserts this in its own file.
  - name: Composer is absent (D6)
    path: /usr/local/bin/composer
    shouldExist: false

commandTests:
  # The per-image default. _common.yaml asserts that an explicit override
  # reaches the ini on every image; this asserts what it reads with no override,
  # which is the value that actually ships.
  - name: rendered ini - memory_limit comes from the environment default (§6.4)
    command: /usr/local/bin/laraoci-entrypoint
    args: ["php", "-r", "echo ini_get('memory_limit');"]
    expectedOutput: ['^256M$']

  # Kept here rather than moved: it is what proves LaraOCI has not clobbered
  # upstream's pool, and it is the M1 result that trap 2 of M2 rests on.
  # images/fpm/Dockerfile carries the fuller audit, since that is the image
  # where these directives are actually load-bearing.
  - name: upstream FPM pool settings survived untouched (§6.3, trap 5)
    command: sh
    args: ["-c", "php-fpm -tt 2>&1 | sed -n 's/.*\\(clear_env\\|daemonize\\) = \\(.*\\)/\\1=\\2/p' | sort -u"]
    expectedOutput:
      - 'clear_env=no'
      - 'daemonize=no'
