# The smoke stack's web tier. Mounted over /etc/nginx/conf.d/default.conf, which
# replaces the stock server block rather than sitting alongside it.
#
# This is a TEST FIXTURE, not a recommended production configuration - it carries
# no TLS, no rate limiting, no real-IP handling and no caching. What it does have
# is the one thing the smoke suite needs to be honest: a genuine FastCGI hop to
# the fpm container over the network, on the same port 9000 the image EXPOSEs, so
# a request travels the path a real deployment would.

server {
    listen 80;
    server_name _;

    # public/, not the application root. Serving the tree above it would expose
    # .env, storage/ and vendor/ - and would let GET / succeed by reading a file
    # rather than by reaching PHP.
    root /var/www/html/public;
    index index.php;

    # The fixture's Vite build lands in public/build/. These are served by nginx
    # directly, which is what makes GET / meaningful: the route reports the
    # hashed asset name out of the manifest, and a browser (or a curl) can then
    # fetch that exact file from this server.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;

        # `fpm` is the compose service name, resolved by Docker's embedded DNS.
        # nginx only starts after that service reports healthy (compose.yml), so
        # this never races the pool coming up.
        fastcgi_pass fpm:9000;
        fastcgi_index index.php;

        # $document_root is this server's root, and it is identical to the path
        # inside the fpm container because both mount the same named volume at
        # /var/www/html. If the two ever diverged, PHP-FPM would report
        # "Primary script unknown" - which is why both mounts are declared at the
        # same target rather than left to convention.
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # The fixture's imagick routes build and resize an image in-process; the
        # default 60s is ample, but an explicit value keeps a slow arm64 runner
        # from turning a pass into a 504 that looks like an application bug.
        fastcgi_read_timeout 60s;
    }

    # Dotfiles are unreachable even though root is public/ - defence in depth,
    # and it keeps this file honest as an example someone might copy.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
