version: 1
defaults:
  registry: ghcr.io/laraoci
  # Without this every tag this fixture produces carries the literal suite
  # `null` - readable in a jq dump, invisible in an assertion, and a trap for
  # anyone writing a test that expects a reference shaped like a real one.
  debian: trixie
  platforms: [linux/amd64, linux/arm64]
  runners: { linux/amd64: ubuntu-24.04, linux/arm64: ubuntu-24.04-arm }
php:
  "8.3": { status: supported }
  "8.4": { status: supported, default: true }
  "8.5": { status: deprecated, deprecated_on: "2026-06-30" }
size_budgets: { runtime: 1, cli: 1, fpm: 1, builder: 1, queue: 1, scheduler: 1 }
images:
  runtime: {}
  cli: { parent: runtime }
  fpm: { parent: runtime }
  builder: { parent: runtime }
  queue: { parent: cli }
  scheduler: { parent: cli }
