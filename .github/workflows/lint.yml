name: lint

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Install tools
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          bin/fetch-tool.sh \
            --url https://github.com/mvdan/sh/releases/download/v3.13.1/shfmt_v3.13.1_linux_amd64 \
            --sha256 fb096c5d1ac6beabbdbaa2874d025badb03ee07929f0c9ff67563ce8c75398b1 \
            --dest "$HOME/.local/bin/shfmt"
      - name: shellcheck
        run: |
          set -euo pipefail
          mapfile -t scripts < <(git ls-files '*.sh')
          shellcheck -S warning "${scripts[@]}"
      - name: shfmt
        run: |
          set -euo pipefail
          mapfile -t scripts < <(git ls-files '*.sh')
          shfmt -d -i 2 -ci "${scripts[@]}"

  actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Install gettext-base
        run: sudo apt-get update && sudo apt-get install -y gettext-base
      - name: Run unit tests
        run: tests/bats/bin/bats tests/unit

  dockerfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Install hadolint
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          bin/fetch-tool.sh \
            --url https://github.com/hadolint/hadolint/releases/download/v2.14.0/hadolint-linux-x86_64 \
            --sha256 6bf226944684f56c84dd014e8b979d27425c0148f61b3bd99bcc6f39e9dc5a47 \
            --dest "$HOME/.local/bin/hadolint"
      - name: hadolint
        run: |
          set -euo pipefail
          # tests/bats is a vendored submodule. Its Dockerfiles are third-party
          # code and hadolint fails on them; this job only passed in CI because
          # its checkout happened to omit submodules (M6).
          find images tests -path tests/bats -prune -o \
            \( -name 'Dockerfile' -o -name '*.Dockerfile' \) -print0 \
            | xargs -0 -r hadolint
