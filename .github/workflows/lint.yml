name: lint

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tools
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          bin/fetch-tools.sh --dest "$HOME/.local/bin" shfmt
      - name: shellcheck
        run: |
          set -euo pipefail
          mapfile -t scripts < <(git ls-files '*.sh')
          shellcheck -S warning "${scripts[@]}"
      - name: shfmt
        run: |
          set -euo pipefail
          mapfile -t scripts < <(git ls-files '*.sh')
          shfmt -d -i 2 -ci "${scripts[@]}"

  actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install gettext-base
        run: sudo apt-get update && sudo apt-get install -y gettext-base
      - name: Run unit tests
        run: |
          set -euo pipefail
          bats_bin="$(bin/fetch-tools.sh --path bats)"
          "$bats_bin" tests/unit

  dockerfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install hadolint
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          bin/fetch-tools.sh --dest "$HOME/.local/bin" hadolint
      - name: hadolint
        run: |
          set -euo pipefail
          find images tests \
            \( -name 'Dockerfile' -o -name '*.Dockerfile' \) -print0 \
            | xargs -0 -r hadolint
