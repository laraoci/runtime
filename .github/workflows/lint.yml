name: lint

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Same shape as pr.yml and smoke.yml. Four jobs per push to a PR branch is the
# cheapest work in this repository, but it is also the most frequent.
concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tools
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          bin/fetch-tools.sh --dest "$HOME/.local/bin" shfmt
          bin/fetch-tools.sh --dest "$HOME/.local/bin" shellcheck
      - name: shellcheck
        run: |
          set -euo pipefail
          shellcheck --version
          # '*.bash' as well as '*.sh': tests/smoke/helpers.bash is ordinary bash
          # sourced by every smoke suite, and a selector that names one extension
          # leaves it unlinted on both this path and the Makefile's.
          mapfile -t scripts < <(git ls-files '*.sh' '*.bash')
          shellcheck -S warning "${scripts[@]}"
      - name: shfmt
        run: |
          set -euo pipefail
          mapfile -t scripts < <(git ls-files '*.sh' '*.bash')
          shfmt -d -i 2 -ci "${scripts[@]}"

  actions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # NOT rhysd/actionlint. The action carried its own version (v1.7.12) beside
      # tools.env's pin (1.7.7), so `make actions` and this job could disagree -
      # the exact drift tools.env exists to prevent, in the one shape the
      # "no unchecked tool" tests could not see.
      - name: Install actionlint and the shellcheck it shells out to
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          bin/fetch-tools.sh --dest "$HOME/.local/bin" actionlint
          # actionlint lints every run: body by invoking `shellcheck`, and treats
          # a missing one as "skip the rule" without saying so. Pinning actionlint
          # and then letting it use the runner's shellcheck leaves the actual
          # shell linting unpinned - the same drift the comment above rejects the
          # marketplace action for. tools.env already carries the pin.
          bin/fetch-tools.sh --dest "$HOME/.local/bin" shellcheck
      - name: actionlint
        run: |
          set -euo pipefail
          actionlint --version
          actionlint

  bats:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install gettext-base
        run: sudo apt-get update && sudo apt-get install -y gettext-base
      - name: Run unit tests
        run: |
          set -euo pipefail
          bats_bin="$(bin/fetch-tools.sh --path bats)"
          "$bats_bin" tests/unit

  dockerfiles:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install hadolint
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          bin/fetch-tools.sh --dest "$HOME/.local/bin" hadolint
      - name: hadolint
        run: |
          set -euo pipefail
          # THE SAME SELECTOR THE MAKEFILE USES. `find images tests` and
          # `git ls-files` are equivalent for today's tree and diverge two ways:
          # a Dockerfile outside images/ and tests/ is linted locally and not
          # here, and an untracked one is linted here and not locally. One
          # selector, pinned by tests/unit/workflows.bats.
          git ls-files -z '*Dockerfile' '*.Dockerfile' | xargs -0 -r hadolint
