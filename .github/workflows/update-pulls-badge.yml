name: Update Docker pulls badge

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  packages: read
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout

      - name: Calculate total pulls
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          images=(
            runtime
            cli
            fpm
            builder
            queue
            scheduler
          )

          total=0

          for img in "${images[@]}"; do
            pulls=$(gh api\
              /users/laraoci/packages/container/$img \
              --jq '.download_count')

            echo "$img: $pulls"
            total=$((total + pulls))
          done

          echo "Total: $total"

          cat > .github/badges/docker-pulls.json <<EOF
          {
            "schemaVersion": 1,
            "label": "Docker pulls",
            "message": "$total",
            "color": "blue"
          }
          EOF

      - name: Commit badge
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .github/badges/docker-pulls.json
          git commit -m "Update Docker pulls badge" || exit 0
          git push
