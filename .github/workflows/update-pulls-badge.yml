name: Update Docker pulls badge

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  packages: read
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Calculate total pulls
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          images=(
            runtime
            cli
            fpm
            builder
            queue
            scheduler
          )

          total=0

          for img in "${images[@]}"; do
            pulls=$(gh api \
              /orgs/laraoci/packages/container/"$img" \
              --jq '.download_count')

            echo "$img: $pulls"
            total=$((total + pulls))
          done

          echo "Total: $total"

          cat > .github/badges/docker-pulls.json <<EOF
          {
            "message": "$total",
          }
          EOF

      - name: Commit badge
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .github/badges/docker-pulls.json
          git commit -m "Update Docker pulls badge" || exit 0
          git push
