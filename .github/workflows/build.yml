name: build

on:
  workflow_call:
    inputs:
      php:
        required: true
        type: string
      image:
        required: true
        type: string
      platforms:
        required: true
        type: string
        description: >-
          Comma-separated buildx platform list. When push is false the result is
          loaded into the local Docker daemon, which supports exactly ONE
          platform - pass a single value on that path. Enforced below.
      push:
        required: false
        type: boolean
        default: false
      cache_mode:
        required: false
        type: string
        default: max
      dockerfile:
        required: true
        type: string
      debian:
        required: true
        type: string
        description: Debian suite for this leg, resolved from config/images.yml by bin/matrix.sh.
      runner:
        required: false
        type: string
        default: ubuntu-latest
        description: >-
          The runner label for this leg, emitted per-platform by bin/matrix.sh
          from config/images.yml's defaults.runners. Native by construction
          (D3a): an arm64 leg lands on arm64 hardware, never on QEMU. Defaults
          to ubuntu-latest so a caller that predates the field still runs.
      dated_suffix:
        required: false
        type: string
        default: ""
        description: >-
          This release's immutable date suffix, e.g. `-20260801` or
          `-20260801-2`, computed ONCE by release.yml's prepare job.
          A child leg appends it to PARENT_REF so it builds against THIS release's
          runtime rather than against a rolling tag that has not moved yet - the
          rolling tags are repointed only after the whole matrix (LOCI-046), so
          on the push path a rolling parent would resolve to the PREVIOUS
          release. Empty on the PR path, where the parent comes from the local
          daemon (D27).
      registry_namespace:
        required: false
        type: string
        default: ""
        description: >-
          Overrides config/images.yml's defaults.registry. Exists for the
          throwaway-namespace dry run that 🚦 Gate 2 inspects, so the full
          release path can be exercised without writing a single
          ghcr.io/laraoci/* tag. Empty means "use the config", which is what
          every real release does.
      structure_test:
        required: false
        type: boolean
        default: false
    outputs:
      image_ref:
        description: Fully-qualified image reference
        value: ${{ jobs.build.outputs.image_ref }}
      digest:
        description: Image digest
        value: ${{ jobs.build.outputs.digest }}

# NO `permissions:` BLOCK HERE, ON PURPOSE. A called workflow's declared
# permissions must be a SUBSET of what the calling job was granted, so
# declaring `packages: write` made this workflow uncallable from pr.yml
# (`contents: read` -> packages: none) and would fail the same way on any fork
# PR, where the token is capped read-only no matter what the caller asks for.
# With no block the token is inherited from the calling job, which is the right
# place for the decision: the PR path never pushes and needs nothing beyond
# `contents: read`, and the M4 release caller must grant `packages: write` on
# its own job for the login/push steps below.
# M4 adds two more the release caller must grant on its own job:
# `id-token: write` for cosign's keyless OIDC, and `security-events: write` for
# the SARIF upload. Both are deliberately absent from pr.yml, which is asserted
# to request no write permission at all (H2) - so both steps are gated on the
# push path, and a PR run neither needs nor can obtain them.

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    outputs:
      image_ref: ${{ steps.meta.outputs.image_ref }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        # DRIVER IS LOAD-BEARING (🧭 5). Every image below `runtime` begins
        # `FROM ghcr.io/laraoci/<parent>:<php>-<suite>`, a reference that exists
        # in no registry until the release path pushes one. On the load path the
        # parents are therefore built into the local daemon by
        # bin/build-chain.sh - and the docker-container driver this action
        # creates by default has its OWN store and cannot see the daemon's
        # images, so the child's FROM fails with a bare "not found" that reads
        # like a registry outage. The `docker` driver IS the daemon's BuildKit,
        # so it resolves the just-built tag with no registry involved.
        # Reproduced both ways before this was written.
        #
        # The push path keeps docker-container, which is what supports the GHA
        # cache and, in M4, multi-platform manifests. There the parents come
        # from GHCR like any other reference and the ordering is a `needs:`
        # problem for the release workflow rather than a driver problem.
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver: ${{ inputs.push && 'docker-container' || 'docker' }}

      - name: Log in to GHCR
        if: ${{ inputs.push }}
        uses: docker/login-action@06fb636fac595d6fb4b28a5dfcb21a6f5091859c # v4.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install the pinned yq
        run: |
          set -euo pipefail
          # config/images.yml decides the matrix, the image identity and the
          # budgets; the runner's preinstalled yq is a version nothing pinned.
          # Same reasoning as bin/lib/common.sh, which resolves it through this
          # fetcher for every script.
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          bin/fetch-tools.sh --dest "$HOME/.local/bin" yq

      - name: Resolve the registry namespace
        id: ns
        env:
          OVERRIDE: ${{ inputs.registry_namespace }}
        run: |
          set -euo pipefail
          # One resolution, three consumers (the tag, PARENT_REF and the push
          # target). A namespace that disagreed between them would build the
          # right thing and publish it under the wrong name.
          registry="$OVERRIDE"
          if [ -z "$registry" ]; then
            registry="$(yq -r '.defaults.registry' config/images.yml)"
          fi
          echo "registry=${registry}" >> "$GITHUB_OUTPUT"

        # The registry comes from config/images.yml rather than from a literal.
        # It used to be hardcoded, which was harmless while nothing else derived
        # it - but PARENT_REF now does, and a tag and a parent reference that
        # disagree about the registry would produce a leg that builds the wrong
        # thing and says the right thing. One source, both uses.
      - name: Compute image reference
        id: meta
        env:
          IMAGE: ${{ inputs.image }}
          PHP: ${{ inputs.php }}
          DEBIAN: ${{ inputs.debian }}
          REGISTRY: ${{ steps.ns.outputs.registry }}
        run: |
          set -euo pipefail
          echo "image_ref=${REGISTRY}/${IMAGE}:${PHP}-${DEBIAN}" >> "$GITHUB_OUTPUT"

      - name: Resolve identity from config/images.yml (D8)
        id: identity
        run: |
          set -euo pipefail
          {
            echo "name=$(yq -r '.defaults.user.name' config/images.yml)"
            echo "uid=$(yq -r '.defaults.user.uid' config/images.yml)"
            echo "gid=$(yq -r '.defaults.user.gid' config/images.yml)"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve OCI labels (§11)
        id: oci
        env:
          IMAGE: ${{ inputs.image }}
          PHP: ${{ inputs.php }}
          DEBIAN: ${{ inputs.debian }}
          REGISTRY: ${{ steps.ns.outputs.registry }}
          DATED_SUFFIX: ${{ inputs.dated_suffix }}
        run: |
          set -euo pipefail
          # D28, DISCHARGED ON THE PUSH PATH. A child's real base is its LaraOCI
          # parent, not the upstream PHP image - but until this milestone there
          # was no truthful digest to name, because --load produces no manifest.
          # On the release path the parent is a published, immutable dated tag,
          # so both halves of the label can finally be correct.
          #
          # The PR path keeps the upstream base, and keeps the debt: there is
          # still no parent manifest there (D27). The label is therefore
          # accurate on every image that is PUBLISHED, which is the only place
          # a consumer can read it.
          parent="$(IMAGE="$IMAGE" yq -r '.images[strenv(IMAGE)].parent // ""' config/images.yml)"
          if [ -n "$parent" ] && [ -n "$DATED_SUFFIX" ]; then
            base="${REGISTRY}/${parent}:${PHP}-${DEBIAN}${DATED_SUFFIX}"
            base_name="${REGISTRY}/${parent}"
          else
            base="php:${PHP}-fpm-${DEBIAN}"
            base_name="docker.io/library/${base}"
          fi
          digest="$(docker buildx imagetools inspect "$base" --format '{{.Manifest.Digest}}')"
          {
            echo "base_name=${base_name}"
            echo "base_digest=${digest}"
            echo "description=$(yq -r ".images.\"${IMAGE}\".description" config/images.yml)"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

        # BUILD ARGS ARE COMPOSED, NOT LISTED (🧭 5). A child image declares
        # PARENT_REF and does not declare BASE_DIGEST; the root is the other way
        # round. Passing both to both would make BuildKit warn about an unused
        # build argument on every leg, and a warning that is always present is a
        # warning nobody reads. PARENT_REF is passed explicitly rather than left
        # to the Dockerfile's default so that config/images.yml stays the source
        # of the registry, and so M4 can pin the parent by digest here.
      - name: Compose build arguments
        id: args
        env:
          IMAGE: ${{ inputs.image }}
          PHP: ${{ inputs.php }}
          DEBIAN: ${{ inputs.debian }}
          BASE_DIGEST: ${{ steps.oci.outputs.base_digest }}
          USER_NAME: ${{ steps.identity.outputs.name }}
          USER_UID: ${{ steps.identity.outputs.uid }}
          USER_GID: ${{ steps.identity.outputs.gid }}
          REGISTRY: ${{ steps.ns.outputs.registry }}
          DATED_SUFFIX: ${{ inputs.dated_suffix }}
        run: |
          set -euo pipefail
          # strenv, not string interpolation: the image name reaches a query, a
          # shell command line and a registry reference, and this is the one
          # form that never lets it be read as syntax.
          parent="$(yq -r '.images[strenv(IMAGE)].parent // ""' config/images.yml)"
          {
            echo 'args<<LARAOCI_EOF'
            echo "PHP_VERSION=${PHP}"
            echo "DEBIAN_RELEASE=${DEBIAN}"
            echo "USER_NAME=${USER_NAME}"
            echo "USER_UID=${USER_UID}"
            echo "USER_GID=${USER_GID}"
            if [ -n "$parent" ]; then
              # The suffix is empty on the PR path, where the parent was built
              # into the daemon by bin/build-chain.sh (D27), and is this
              # release's immutable dated suffix on the push path. A rolling
              # parent would be WRONG on the push path: rolling tags do not move
              # until every leg has passed (LOCI-046), so the rolling
              # `:<php>-<suite>` tag still points at the PREVIOUS release while
              # this one is building.
              echo "PARENT_REF=${REGISTRY}/${parent}:${PHP}-${DEBIAN}${DATED_SUFFIX}"
            else
              echo "BASE_DIGEST=@${BASE_DIGEST}"
            fi
            echo 'LARAOCI_EOF'
          } >> "$GITHUB_OUTPUT"

        # The ancestors have to exist in the daemon before the target's FROM is
        # resolved. Unconditional for any image: it is a no-op for the graph
        # root, so there is no `if` here to get out of step with the graph.
        # Ancestors are built without labels and without a resolved base digest
        # - they are scaffolding for this leg, not artifacts. The one that gets
        # published is always built by the step below, on its own leg.
      - name: Build the ancestor chain (🧭 5)
        if: ${{ !inputs.push }}
        env:
          IMAGE: ${{ inputs.image }}
          PHP: ${{ inputs.php }}
        run: |
          set -euo pipefail
          bin/build-chain.sh --image "$IMAGE" --php "$PHP" --ancestors-only

      - name: Reject a multi-platform build that cannot be loaded
        if: ${{ !inputs.push }}
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          set -euo pipefail
          case "$PLATFORMS" in
            *,*)
              echo "::error::platforms='${PLATFORMS}' with push=false. BuildKit cannot load a manifest list into the Docker daemon, so this leg would fail inside the build action with an opaque exporter error. Call this workflow with one platform per leg, or set push=true." >&2
              exit 1
              ;;
          esac
          echo "single platform '${PLATFORMS}' - safe to load"

      - name: Build
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: false
          load: ${{ !inputs.push }}
          tags: ${{ inputs.push && '' || steps.meta.outputs.image_ref }}
          # PUSH BY DIGEST, NOT BY TAG (D3a's consequence). Native arm64 means no
          # single runner can produce both platforms, so a leg builds ONE
          # platform on ITS OWN hardware and publishes an untagged digest; a
          # merge job assembles the manifest list per tag with
          # `docker buildx imagetools create` once every platform has landed.
          #
          # Tagging a per-platform manifest here would publish a single-arch
          # image under a name consumers read as multi-arch, which is worse than
          # not publishing it.
          #
          # `imagetools create`, not `docker manifest create`: the latter drops
          # the SBOM and provenance attestations on the floor.
          outputs: ${{ inputs.push && format('type=image,name={0}/{1},push-by-digest=true,name-canonical=true,push=true', steps.ns.outputs.registry, inputs.image) || '' }}
          build-args: ${{ steps.args.outputs.args }}
          labels: |
            org.opencontainers.image.title=laraoci/${{ inputs.image }}
            org.opencontainers.image.description=${{ steps.oci.outputs.description }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.documentation=${{ github.server_url }}/${{ github.repository }}#readme
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.oci.outputs.created }}
            org.opencontainers.image.version=${{ inputs.php }}-${{ inputs.debian }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.base.name=${{ steps.oci.outputs.base_name }}
            org.opencontainers.image.base.digest=${{ steps.oci.outputs.base_digest }}
          # PR legs must never WRITE the cache: Actions cache entries written
          # from a PR branch are restorable by workflows on the default branch,
          # so an unmerged PR could otherwise seed layers that a later release
          # build ships.
          #
          # They no longer READ it either, and that is a consequence of 🧭 5
          # rather than a preference: the gha cache backend needs the
          # docker-container driver, and the load path runs on the docker driver
          # so that a child can resolve the parent this leg just built. It costs
          # nothing today - cache-to has always been gated on push, and nothing
          # has ever pushed, so the import has never had an entry to find. It
          # will cost something once M4 starts writing the cache on release
          # builds. If PR build time becomes the complaint at that point, the
          # escape hatch is 🧭 5's option (b): a registry:2 service on the job,
          # which lets the container driver keep both the cache and a resolvable
          # parent. That trade is deliberately not pre-paid here.
          cache-from: ${{ inputs.push && 'type=gha' || '' }}
          cache-to: ${{ inputs.push && format('type=gha,mode={0}', inputs.cache_mode) || '' }}
          # SPDX SBOM and SLSA provenance, attached to the pushed digest as
          # in-toto attestation manifests (§11, §9.2). Predicates are
          # `https://spdx.dev/Document` and `https://slsa.dev/provenance/v0.2`.
          #
          # mode=max, not the default min: min omits the Dockerfile, the build
          # arguments and the layer source maps, which is most of what makes
          # provenance answer the question anyone asks it. The cost is that the
          # build arguments become PUBLIC - fine here, where they are the PHP
          # version, the Debian suite and the uid/gid, and no secret has ever
          # been passed as a build arg in this repository.
          #
          # Off on the load path: attestations produce a manifest INDEX, and
          # BuildKit cannot load an index into the Docker daemon - the same
          # constraint the multi-platform guard above exists for.
          sbom: ${{ inputs.push }}
          provenance: ${{ inputs.push && 'mode=max' || 'false' }}

        # docs/release-verification.md, discharged. Every step below runs against
        # the PUSHED DIGEST. Rebuilding on the load path and inspecting that would
        # verify a DIFFERENT artifact - same Dockerfile, different bytes, possibly
        # a different base once M5's weekly rebuild starts moving it.
      - name: Assert the image metadata against the pushed digest (§11, §6.2)
        if: ${{ inputs.push }}
        env:
          IMAGE: ${{ inputs.image }}
          REF: ${{ steps.ns.outputs.registry }}/${{ inputs.image }}@${{ steps.build.outputs.digest }}
          PLATFORM: ${{ inputs.platforms }}
        run: |
          set -euo pipefail
          # Reads the config blob from the registry - no pull, and it would
          # cover every platform of a manifest list if this leg produced one.
          # This is the ONLY place STOPSIGNAL is asserted anywhere, so it is the
          # most consequential step in the workflow.
          bin/assert-metadata.sh --image "$IMAGE" --ref "$REF" \
          --source registry --platform "$PLATFORM"

      - name: Pull the pushed digest
        if: ${{ inputs.push }}
        env:
          REF: ${{ steps.ns.outputs.registry }}/${{ inputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          # The structure tests and the size measurement need a local image, and
          # this is the pull that gives them one. It is native: the leg runs on
          # the runner matching the platform it built (D3a), so `builder`'s
          # arm64 tool assertions EXECUTE here rather than being cross-compiled
          # and never run (trap 2 / finding 12).
          docker pull "$REF"

      - name: Structure tests against the pushed digest (§10.1)
        if: ${{ inputs.push && inputs.structure_test }}
        env:
          IMAGE: ${{ inputs.image }}
          REF: ${{ steps.ns.outputs.registry }}/${{ inputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          bin/structure-test.sh --image "$IMAGE" --ref "$REF"

      - name: Size budget against the pushed digest (D17, enforcing)
        if: ${{ inputs.push }}
        env:
          IMAGE: ${{ inputs.image }}
          REF: ${{ steps.ns.outputs.registry }}/${{ inputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          # NO --report (§9.2, D17): an overrun exits 1 and fails the release.
          # Same instrument as the frozen budgets - docker save | gzip - on the
          # digest that was just pulled.
          bin/size-check.sh --image "$IMAGE" --ref "$REF" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Assert the attestations are attached (§11)
        if: ${{ inputs.push }}
        env:
          REF: ${{ steps.ns.outputs.registry }}/${{ inputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          # An attestation nobody can retrieve is worth what an unverifiable
          # signature is worth. This is the retrieval, run against the published
          # digest, so LOCI-048's documented commands are known to work before
          # they are written into the README as gospel.
          sbom="$(docker buildx imagetools inspect "$REF" --format '{{ json .SBOM }}')"
          packages="$(jq -r '[.. | .packages? // empty] | add | length' <<<"$sbom")"
          if [ -z "$packages" ] || [ "$packages" = "null" ] || [ "$packages" -lt 1 ]; then
            echo "::error::no SPDX packages in the SBOM attestation for ${REF}" >&2
            exit 1
          fi
          echo "SBOM: ${packages} packages"

          prov="$(docker buildx imagetools inspect "$REF" --format '{{ json .Provenance }}')"
          if ! jq -e '[.. | .buildType? // empty] | length > 0' >/dev/null <<<"$prov"; then
            echo "::error::no SLSA provenance attestation for ${REF}" >&2
            exit 1
          fi
          jq -r '[.. | .buildType? // empty] | .[0]' <<<"$prov"

      - name: Install the pinned trivy
        if: ${{ inputs.structure_test }}
        run: |
          set -euo pipefail
          # Through the checksum-verifying fetcher, never the marketplace
          # action - see tools.env's TRIVY block for the March 2026 incident
          # that decided it, and workflows.bats L5 for the rule that enforces it.
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          bin/fetch-tools.sh --dest "$HOME/.local/bin" trivy

      # SARIF FIRST, GATE SECOND, and the order is the point: the gate exits 1,
      # and a report that only uploads when the gate passes is a report that is
      # missing on exactly the runs anyone wants to read.
      - name: Scan the pushed digest and write SARIF (§11)
        if: ${{ inputs.push }}
        env:
          REF: ${{ steps.ns.outputs.registry }}/${{ inputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          trivy image --format sarif --output trivy.sarif \
            --ignore-unfixed --severity CRITICAL,HIGH --exit-code 0 "$REF"

      - uses: github/codeql-action/upload-sarif@ea14db8afdef5d462e69d78c4ca45002d4522418 # v4.37.4
        if: ${{ inputs.push }}
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ inputs.image }}-${{ inputs.php }}-${{ inputs.platforms }}

      - name: Vulnerability gate (§9.2 - fixable CRITICAL/HIGH)
        if: ${{ inputs.push }}
        env:
          REF: ${{ steps.ns.outputs.registry }}/${{ inputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          # --exit-code 1 makes it a gate. --ignore-unfixed keeps it one a
          # release can actually clear: an unfixable CVE would otherwise block
          # every release until upstream moved, and a gate that can never be
          # satisfied is a gate that gets switched off (🧭 3).
          trivy image --ignore-unfixed --severity CRITICAL,HIGH --exit-code 1 "$REF"

      - name: Vulnerability scan (advisory on PRs, §9.1)
        if: ${{ !inputs.push && inputs.structure_test }}
        env:
          IMAGE_REF: ${{ steps.meta.outputs.image_ref }}
        run: |
          set -euo pipefail
          # Advisory: the finding is surfaced, the PR is not blocked. No SARIF
          # upload here - pr.yml requests no write permission (H2) and must not
          # start.
          trivy image --ignore-unfixed --severity CRITICAL,HIGH --exit-code 0 \
            "$IMAGE_REF" | tee -a "$GITHUB_STEP_SUMMARY"

        # Two image-config assertions that container-structure-test cannot make:
        # labels, because CST reads them, but they are applied by THIS workflow
        # rather than by the Dockerfile, and the stop signal, because CST's
        # metadataTest schema has no field for it and a container cannot read
        # its own.
        #
        # Skipped on the push path, like the structure tests and the size report -
        # see docs/release-verification.md, which is the M4 acceptance criterion
        # for all of them. This step is the ONLY place STOPSIGNAL is asserted
        # (container-structure-test has no field for it), so it is the most
        # consequential of the three.
      - name: Assert the image metadata (§11, §6.2)
        if: ${{ !inputs.push }}
        env:
          IMAGE: ${{ inputs.image }}
          IMAGE_REF: ${{ steps.meta.outputs.image_ref }}
        run: |
          set -euo pipefail
          bin/assert-metadata.sh --image "$IMAGE" --ref "IMAGE_REF" --source daemon

      # Both of the steps below need the image present in the local daemon, so
      # they are gated on the build-and-load path. On a push build there is
      # nothing to inspect locally; M4 re-does size measurement against the
      # registry once `imagetools inspect` has something to look at.
      #
      # CONSEQUENCE, stated so it is not lost: the artifact that gets
      # PUBLISHED is the one artifact never structure-tested - and the same
      # is true of the metadata assertion and the size check.
      # docs/release-verification.md records what the push path must do
      # instead, per step, and tests/unit/workflows.bats fails if a new gate
      # is added without a row there.
      # No install step: bin/structure-test.sh resolves the pinned checker through
      # bin/fetch-tools.sh itself, the same way lint.yml's bats job does. The step
      # that used to be here passed the hyphenated tool name straight into a shell
      # variable name and died with `CONTAINER-STRUCTURE-TEST_URL: invalid
      # variable name`, so it failed every time it ran.

      # No-ops with a message for any image that has no tests/structure/<name>.yaml
      # yet, so M2 and M3 gain coverage by adding a file rather than editing CI.
      - name: Structure tests (§10.1)
        if: ${{ inputs.structure_test && !inputs.push }}
        env:
          IMAGE: ${{ inputs.image }}
          IMAGE_REF: ${{ steps.meta.outputs.image_ref }}
        run: |
          set -euo pipefail
          bin/structure-test.sh --image "$IMAGE" --ref "$IMAGE_REF"

      # Advisory here, and skipped entirely on the push path; §9.2 and D17 make
      # the release form ENFORCING. See docs/release-verification.md.
      - name: Size report (D17, advisory on PRs)
        if: ${{ !inputs.push }}
        env:
          IMAGE: ${{ inputs.image }}
          LARAOCI_TAG: ${{ inputs.php }}-${{ inputs.debian }}
        run: |
          set -euo pipefail
          bin/size-check.sh --image "$IMAGE" --report | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Export the digest for the merge job
        if: ${{ inputs.push }}
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          # The merge job needs every platform digest for this image x php, and
          # a reusable workflow called in a matrix has ONE outputs object that
          # each leg overwrites. An artifact per leg is the only carrier that
          # survives the fan-in.
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ inputs.push }}
        with:
          name: digests-${{ inputs.image }}-${{ inputs.php }}-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1
