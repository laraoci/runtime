name: release

# §9.2. The first workflow in this repository that publishes anything, and the
# reason M4 is different from every milestone before it: a published dated tag
# is forever, and a half-updated rolling tag is worse than a failed release.
#
# SHAPE, because it is not obvious, and it is not arbitrary:
#
#   prepare -> build-d0 -> merge-d0 -> build-d1 -> merge-d1
#           -> build-d2 -> merge-d2 -> release-required -> repoint -> notes
#
# Two things force it.
#
# 1. NATIVE ARM64 (D3a). No runner builds both platforms, so a leg builds ONE
#    platform on ITS OWN hardware and pushes an untagged digest; merge assembles
#    the manifest list. 36 build legs, 18 merge jobs.
#
# 2. THE PARENT PROBLEM. Every image below runtime begins FROM
#    ghcr.io/laraoci/<parent>. Rolling tags do not move until the whole matrix
#    passes (LOCI-046), so a child resolving `:8.4-trixie` on the push path
#    would build against the PREVIOUS release. Children are therefore pinned to
#    THIS release's immutable dated tag, and the stages exist to make that
#    ordering real.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      registry_namespace:
        description: >-
          Override ghcr.io/laraoci for a dry run. 🚦 Gate 2 exercises the entire
          release path against a throwaway namespace before a single real tag
          is written; the input stays afterwards, because a staging release is
          what should precede any risky change to this workflow.
        required: false
        type: string
        default: ""
      dry_run:
        description: >-
          Skip the rolling-tag repoint. Dated tags are still written - they are
          immutable and namespaced by the input above - but :latest and the
          :8.x tags are left alone.
        required: false
        type: boolean
        default: false
      include_deprecated:
        description: >-
          Publish a `deprecated` PHP version as well (§13). A deliberate,
          operator-typed action: deprecation stops the SCHEDULED rebuild, it does
          not forbid a release someone explicitly asked for. The rolling tag
          still does NOT move - that freeze is enforced in the repoint job and is
          not reachable from this input.
        required: false
        type: boolean
        default: false
  # CALLED BY .github/workflows/rebuild.yml (§9.3, LOCI-049). The scheduled
  # rebuild reuses this entire orchestration - the staged matrix, the merge
  # jobs, release-required and the repoint - rather than duplicating it, because
  # a second copy of "how a LaraOCI release is assembled" is a second thing to
  # keep correct and the one that would rot is the one no human watches.
  #
  # Two inputs are what make a rebuild different from a release: is_rebuild,
  # which the channel resolution reads (🧭 2), and rebuild_stamp, which reaches
  # runtime's apt layer (🧭 1). Everything else is inherited unchanged.
  workflow_call:
    inputs:
      registry_namespace:
        required: false
        type: string
        default: ""
      dry_run:
        required: false
        type: boolean
        default: false
      is_rebuild:
        required: false
        type: boolean
        default: false
        description: >-
          This run is a scheduled rebuild (§9.3): it carries no tag, but it does
          publish a new dated tag and it does repoint the rolling tags. Read by
          the channel resolution in `prepare` (🧭 2, D45). Deliberately NOT a
          workflow_dispatch input - a human dispatching this workflow must not be
          able to repoint :latest off a branch ref.
      rebuild_stamp:
        required: false
        type: string
        default: ""
        description: >-
          Forwarded to build.yml, which passes it to the graph root as
          REBUILD_STAMP (🧭 1, D44). Empty on every release.
      include_deprecated:
        required: false
        type: boolean
        default: false
        description: >-
          Wired in Task 6 (LOCI-050). The scheduled rebuild NEVER sets it.

permissions:
  contents: read

# A second release run of the same ref would race the first over the same dated
# tags. Queued, never cancelled: cancelling mid-publish is how a manifest list
# ends up missing an architecture.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    # 18 registry probes for the dated suffix, and nothing else.
    timeout-minutes: 15
    # READ, NOT WRITE. This job publishes nothing - it resolves the dated suffix
    # by asking the registry which dated tags already exist. Without a packages
    # scope that question is answered with a 401 on every private package, and
    # bin/next-dated-suffix.sh reads an unanswered question as "the tag is free".
    permissions:
      contents: read
      packages: read
    outputs:
      dated_suffix: ${{ steps.suffix.outputs.dated_suffix }}
      registry: ${{ steps.ns.outputs.registry }}
      is_stable_release: ${{ steps.channel.outputs.is_stable_release }}
      legs_d0: ${{ steps.legs.outputs.d0 }}
      legs_d1: ${{ steps.legs.outputs.d1 }}
      legs_d2: ${{ steps.legs.outputs.d2 }}
      merge_d0: ${{ steps.legs.outputs.m0 }}
      merge_d1: ${{ steps.legs.outputs.m1 }}
      merge_d2: ${{ steps.legs.outputs.m2 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned yq
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          bin/fetch-tools.sh --dest "$HOME/.local/bin" yq

      - name: Resolve the registry namespace
        id: ns
        env:
          OVERRIDE: ${{ inputs.registry_namespace }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          default="$(yq -r '.defaults.registry' config/images.yml)"
          registry="$OVERRIDE"
          if [ -z "$registry" ]; then
            registry="$default"
          fi

          # A dry run that resolves to the PRODUCTION namespace is not a dry
          # run. `dry_run` skips the repoint and nothing else: the 18 merge jobs
          # still write IMMUTABLE dated tags and cosign still signs them. §8
          # forbids overwriting a dated tag, so this cannot be undone by
          # re-running - the namespace would carry a bogus release permanently.
          #
          # Blank is the dangerous value precisely because it is the DEFAULT of
          # an optional field, so the failure mode is "forgot to type anything"
          # rather than "typed the wrong thing". Refused here, in the first job,
          # while zero legs have started and nothing has been published.
          if [ "$DRY_RUN" = "true" ] && [ "$registry" = "$default" ]; then
            echo "::error::dry_run=true but the namespace resolved to ${default} - refusing to publish" >&2
            echo "       set registry_namespace to a throwaway, e.g. ghcr.io/<user>/laraoci-staging" >&2
            exit 1
          fi

          echo "registry=${registry}" >> "$GITHUB_OUTPUT"

      # WHAT KIND OF RELEASE IS THIS - resolved once, here, beside the namespace,
      # because "does this move the rolling tags" is the same class of question
      # as "which namespace" and belongs in the same job (D36's pattern: resolve
      # release-wide facts once and pass them down, never re-derive per job).
      #
      # Only a STABLE version tag repoints. Three ref shapes can start this
      # workflow and only one of them may move :latest / :8.x:
      #
      #   refs/tags/v1.0.0        stable      -> repoint
      #   refs/tags/v1.0.0-rc.1   prerelease  -> dated + signed tags only
      #   refs/heads/<branch>     dispatch    -> not a release ref at all
      #
      # A prerelease is defined by SemVer as a hyphen-introduced identifier after
      # the version (`1.0.0-rc.1`); a stable release never carries one. This is
      # the spec's own definition, not a heuristic - do not "simplify" it to a
      # regex that treats the hyphen in a date or a branch name as significant.
      # The rolling tags are the ones every consumer pulls by default; pointing
      # them at a rc is the one tagging mistake that reaches everybody at once
      # (bin/release-tags.sh says the same about :latest).
      - name: Resolve the release channel
        id: channel
        env:
          REF: ${{ github.ref }}
          IS_REBUILD: ${{ inputs.is_rebuild }}
        run: |
          set -euo pipefail
          is_stable_release=false
          if [ "$IS_REBUILD" = "true" ]; then
            # 🧭 2 / D45. A scheduled rebuild carries NO TAG - github.ref is
            # refs/heads/main - and the case below would classify that as "not a
            # release ref at all". But §9.3 is explicit that the rebuild produces
            # a new dated tag AND repoints the rolling tags, and that is the
            # whole point of it: the rolling tags are how a consumer who did not
            # pin receives the patched image. A rebuild whose repoint was skipped
            # would publish the fix and leave everybody pulling the vulnerable
            # one.
            #
            # So the channel gains a THIRD answer rather than the rebuild growing
            # a repoint of its own. There stays exactly one definition of "does
            # this move :latest", in one place, tested by one test.
            is_stable_release=true
            echo "::notice::scheduled rebuild - stable channel; rolling tags repoint after the full matrix"
          else
            case "$REF" in
              refs/tags/v*-*)
                # a version tag carrying a prerelease identifier: rc, beta, alpha
                echo "::notice::${REF} is a PRERELEASE - dated tags and signatures only, no rolling repoint" ;;
              refs/tags/v*)
                is_stable_release=true
                echo "::notice::${REF} is a stable release - rolling tags will repoint after the full matrix" ;;
              *)
                # workflow_dispatch on a branch: a staging/dry exercise, never a
                # rolling repoint even when dry_run is false and the namespace is real
                echo "::notice::${REF} is not a version tag - no rolling repoint" ;;
            esac
          fi
          echo "is_stable_release=${is_stable_release}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@06fb636fac595d6fb4b28a5dfcb21a6f5091859c # v4.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # THE ONLY CLOCK READ IN THIS WORKFLOW (🧭 2). 36 legs must agree on one
      # dated tag; a per-leg read splits a release across a midnight boundary,
      # and a per-job suffix probe splits it across a -2. One value, computed
      # here, passed everywhere.
      - name: Resolve this release's dated suffix
        id: suffix
        env:
          LARAOCI_REGISTRY: ${{ steps.ns.outputs.registry }}
          INCLUDE_DEPRECATED: ${{ inputs.include_deprecated }}
        run: |
          set -euo pipefail
          # THE PROBE MUST COVER WHAT THIS RELEASE WILL WRITE (§8). The suffix is
          # "the first date not already taken by ANY image x php this release
          # publishes". Probing a narrower set than the matrix builds is how a
          # release picks -20260817 while runtime:8.5-trixie-20260817 already
          # exists - and §8 forbids overwriting a dated tag, irreversibly. So
          # this flag tracks the matrix's, and the two are set from one input.
          flag=()
          if [ "$INCLUDE_DEPRECATED" = "true" ]; then
            flag=(--include-deprecated)
          fi
          today="$(date -u +%Y%m%d)"
          suffix="$(bin/next-dated-suffix.sh --date "$today" "${flag[@]}")"
          echo "::notice::this release is ${suffix}"
          echo "dated_suffix=${suffix}" >> "$GITHUB_OUTPUT"

      # Six matrices from one script. The merge matrices are the build matrices
      # sliced to a single platform: one platform slice of a depth IS the
      # image x php set, so there is no second selector to keep in step.
      - name: Build the staged matrices
        id: legs
        env:
          INCLUDE_DEPRECATED: ${{ inputs.include_deprecated }}
        run: |
          set -euo pipefail
          # §13. A deliberate release may include a `deprecated` version; the
          # SCHEDULED rebuild never can - rebuild.yml passes nothing here and the
          # input defaults false, so the cron path cannot reach this branch.
          #
          # Publishing a deprecated version is loud, because it is rare and
          # because the operator should see the second half stated: its dated
          # tags are written, its ROLLING tags are not, and that freeze is
          # enforced in the repoint job rather than here.
          flag=()
          if [ "$INCLUDE_DEPRECATED" = "true" ]; then
            flag=(--include-deprecated)
            echo "::warning::publishing DEPRECATED PHP versions - dated tags only, rolling tags stay frozen (§13)"
          fi
          {
            echo "d0=$(bin/matrix.sh --depth 0 "${flag[@]}")"
            echo "d1=$(bin/matrix.sh --depth 1 "${flag[@]}")"
            echo "d2=$(bin/matrix.sh --depth 2 "${flag[@]}")"
            echo "m0=$(bin/matrix.sh --depth 0 --platform linux/amd64 "${flag[@]}")"
            echo "m1=$(bin/matrix.sh --depth 1 --platform linux/amd64 "${flag[@]}")"
            echo "m2=$(bin/matrix.sh --depth 2 --platform linux/amd64 "${flag[@]}")"
          } >> "$GITHUB_OUTPUT"

  # --- depth 0: runtime -------------------------------------------------------

  build-d0:
    needs: prepare
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.legs_d0) }}
    uses: ./.github/workflows/build.yml
    with:
      php: ${{ matrix.php }}
      image: ${{ matrix.image }}
      platforms: ${{ matrix.platform }}
      runner: ${{ matrix.runner }}
      push: true
      cache_mode: max
      dockerfile: ${{ matrix.dockerfile }}
      debian: ${{ matrix.debian }}
      structure_test: true
      dated_suffix: ${{ needs.prepare.outputs.dated_suffix }}
      registry_namespace: ${{ needs.prepare.outputs.registry }}
      rebuild_stamp: ${{ inputs.rebuild_stamp }}

  merge-d0:
    needs: [ prepare, build-d0 ]
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.merge_d0) }}
    uses: ./.github/workflows/merge.yml
    with:
      image: ${{ matrix.image }}
      php: ${{ matrix.php }}
      dated_suffix: ${{ needs.prepare.outputs.dated_suffix }}
      registry_namespace: ${{ needs.prepare.outputs.registry }}

  # --- depth 1: cli, fpm, builder --------------------------------------------

  build-d1:
    needs: [ prepare, merge-d0 ]
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.legs_d1) }}
    uses: ./.github/workflows/build.yml
    with:
      php: ${{ matrix.php }}
      image: ${{ matrix.image }}
      platforms: ${{ matrix.platform }}
      runner: ${{ matrix.runner }}
      push: true
      cache_mode: max
      dockerfile: ${{ matrix.dockerfile }}
      debian: ${{ matrix.debian }}
      structure_test: true
      dated_suffix: ${{ needs.prepare.outputs.dated_suffix }}
      registry_namespace: ${{ needs.prepare.outputs.registry }}
      rebuild_stamp: ${{ inputs.rebuild_stamp }}

  merge-d1:
    needs: [ prepare, build-d1 ]
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.merge_d1) }}
    uses: ./.github/workflows/merge.yml
    with:
      image: ${{ matrix.image }}
      php: ${{ matrix.php }}
      dated_suffix: ${{ needs.prepare.outputs.dated_suffix }}
      registry_namespace: ${{ needs.prepare.outputs.registry }}

  # --- depth 2: queue, scheduler ---------------------------------------------

  build-d2:
    needs: [ prepare, merge-d1 ]
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.legs_d2) }}
    uses: ./.github/workflows/build.yml
    with:
      php: ${{ matrix.php }}
      image: ${{ matrix.image }}
      platforms: ${{ matrix.platform }}
      runner: ${{ matrix.runner }}
      push: true
      cache_mode: max
      dockerfile: ${{ matrix.dockerfile }}
      debian: ${{ matrix.debian }}
      structure_test: true
      dated_suffix: ${{ needs.prepare.outputs.dated_suffix }}
      registry_namespace: ${{ needs.prepare.outputs.registry }}
      rebuild_stamp: ${{ inputs.rebuild_stamp }}

  merge-d2:
    needs: [ prepare, build-d2 ]
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.merge_d2) }}
    uses: ./.github/workflows/merge.yml
    with:
      image: ${{ matrix.image }}
      php: ${{ matrix.php }}
      dated_suffix: ${{ needs.prepare.outputs.dated_suffix }}
      registry_namespace: ${{ needs.prepare.outputs.registry }}

  # --- the gate, and the only irreversible job -------------------------------

  # A stable, always-present check to gate everything irreversible on. Exactly
  # the shape of pr-required and smoke-required, reached from the release side:
  # branch protection and the repoint both require THIS name, never the volatile
  # per-leg ones.
  release-required:
    name: release-required
    needs: [ prepare, build-d0, merge-d0, build-d1, merge-d1, build-d2, merge-d2 ]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Through env:, not interpolated into the run: body (H1). These are
      # trusted result enums, but the rule is blunt on purpose.
      R_PREPARE: ${{ needs.prepare.result }}
      R_B0: ${{ needs.build-d0.result }}
      R_M0: ${{ needs.merge-d0.result }}
      R_B1: ${{ needs.build-d1.result }}
      R_M1: ${{ needs.merge-d1.result }}
      R_B2: ${{ needs.build-d2.result }}
      R_M2: ${{ needs.merge-d2.result }}
    steps:
      - name: Verify every leg of the release succeeded
        run: |
          set -euo pipefail
          # NO `skipped` allowance here, unlike pr-required. A skipped leg on a
          # release is an image that was not published, and the rolling tags
          # would then point at a set that is missing a member.
          fail=0
          for name in R_PREPARE R_B0 R_M0 R_B1 R_M1 R_B2 R_M2; do
            result="${!name}"
            echo "${name}=${result}"
            [ "$result" = "success" ] || fail=1
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::the release matrix did not fully succeed - rolling tags will NOT be repointed" >&2
            exit 1
          fi

  # THE ONLY JOB IN THIS REPOSITORY THAT MOVES A ROLLING TAG.
  #
  # Gated on the aggregate above, so a 36-leg matrix that lost one arm64
  # `builder` leg leaves :8.4, :8.4-trixie and :latest exactly where they were.
  # The dated tags from the successful legs remain published - they are
  # immutable, and a missing one is a visible gap rather than a silent
  # regression, which is the split §8 draws.
  #
  # Gated on is_stable_release as well as the matrix: a prerelease tag
  # (v1.0.0-rc.1) and a branch dispatch both publish immutable dated tags and
  # sign them, but neither moves :latest / :8.x. That distinction is resolved
  # once in `prepare` (see "Resolve the release channel"), not re-derived here.
  # !inputs.dry_run stays because a dry run of a STABLE tag must still be held
  # back - dry_run and prerelease are independent reasons not to repoint.
  repoint:
    needs: [ prepare, release-required ]
    if: ${{ !inputs.dry_run && needs.prepare.outputs.is_stable_release == 'true' }}
    runs-on: ubuntu-latest
    # 18 resolves then 42 rolling-tag writes. The only irreversible job here,
    # so it gets room without getting the default.
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@06fb636fac595d6fb4b28a5dfcb21a6f5091859c # v4.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install the pinned yq
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          bin/fetch-tools.sh --dest "$HOME/.local/bin" yq

      # PHASE 1. Every dated tag this release wrote must resolve, before a
      # single rolling tag moves. "All-or-none" cannot be atomic across 42
      # registry writes - nothing at GHCR offers that - so the job removes
      # every failure mode that is knowable in advance instead. The residual
      # case is a registry rejecting a write mid-loop, which is loud and is
      # fixed by re-running this job alone.
      - name: Resolve every dated digest
        id: resolve
        env:
          DATED_SUFFIX: ${{ needs.prepare.outputs.dated_suffix }}
          LARAOCI_REGISTRY: ${{ needs.prepare.outputs.registry }}
        run: |
          set -euo pipefail
          : > /tmp/repoint.tsv
          missing=0
          while IFS= read -r image; do
            while IFS= read -r php; do
              dated="$(bin/release-tags.sh --image "$image" --php "$php" \
                --kind immutable --dated-suffix "$DATED_SUFFIX" | head -n1)"
              if ! digest="$(docker buildx imagetools inspect "$dated" --format '{{.Manifest.Digest}}' 2>/dev/null)"; then
                echo "::error::${dated} does not resolve - refusing to move any rolling tag" >&2
                missing=1
                continue
              fi
              printf '%s\t%s\t%s\n' "$image" "$php" "$dated" >> /tmp/repoint.tsv
              echo "${dated} -> ${digest}"
              # NO FLAG HERE, EVER (§13, effect 2). THIS IS THE ROLLING-TAG
              # FREEZE. A deprecated version's dated tags were written by the
              # merge jobs above and are permanent; its :8.x and :8.x-trixie do
              # not move, on any path - including a release an operator
              # deliberately opted into. That opt-in is unreachable from this job
              # by construction.
              #
              # The input is not named anywhere in this job, prose included, and
              # that is not squeamishness: tests/unit/workflows.bats asserts the
              # token is absent from the WHOLE job rather than from its code, so
              # that the assertion cannot be satisfied by moving a reference into
              # a comment. A blunt check is the point.
              #
              # Through bin/php-versions.sh rather than an inline yq: this filter
              # IS the freeze, and a filter that load-bearing should not be a
              # string duplicated in YAML that no unit test can reach.
            done < <(bin/php-versions.sh)
          done < <(yq -r '.images | keys | .[]' config/images.yml)

          [ "$missing" -eq 0 ] || exit 1
          echo "resolved=$(wc -l < /tmp/repoint.tsv)" >> "$GITHUB_OUTPUT"

      # PHASE 2. 42 rolling tags: 18 x (:8.x, :8.x-trixie) plus 6 x :latest.
      - name: Move the rolling tags (§8, LOCI-046)
        env:
          LARAOCI_REGISTRY: ${{ needs.prepare.outputs.registry }}
        run: |
          set -euo pipefail
          moved=0
          while IFS=$'\t' read -r image php dated; do
            tags=()
            while IFS= read -r ref; do
              [ -z "$ref" ] && continue
              tags+=(-t "$ref")
              moved=$((moved + 1))
            done < <(bin/release-tags.sh --image "$image" --php "$php" --kind rolling)
            # One create per image x php: imagetools takes every -t at once, so
            # :8.4, :8.4-trixie and :latest move together for that image.
            docker buildx imagetools create "${tags[@]}" "$dated"
          done < /tmp/repoint.tsv
          echo "::notice::repointed ${moved} rolling tags"

  # --- the human-readable end of the release ---------------------------------

  notes:
    needs: [ prepare, release-required ]
    if: ${{ startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      # The published-artifact table inspects every dated manifest. Unlike
      # prepare, this one fails loudly without the scope - a red notes job after
      # a fully successful publish - but it fails all the same.
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@06fb636fac595d6fb4b28a5dfcb21a6f5091859c # v4.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install the pinned yq
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          bin/fetch-tools.sh --dest "$HOME/.local/bin" yq

      - name: Compose the published-artifact table
        env:
          INCLUDE_DEPRECATED: ${{ inputs.include_deprecated }}
          DATED_SUFFIX: ${{ needs.prepare.outputs.dated_suffix }}
          LARAOCI_REGISTRY: ${{ needs.prepare.outputs.registry }}
        run: |
          set -euo pipefail
          # A release note that lists tags without digests is a list of names.
          # §8 recommends digests for production, so the release that recommends
          # it prints them.
          #
          # THE TABLE FOLLOWS THE INPUT, unlike the repoint (§13). A version this
          # release actually published belongs in the list of what it published -
          # omitting it would make the release notes disagree with the registry.
          # Both calls below need the flag: the version list, and
          # bin/release-tags.sh, which refuses a deprecated version's tags
          # without it.
          flag=()
          if [ "$INCLUDE_DEPRECATED" = "true" ]; then
            flag=(--include-deprecated)
          fi
          {
            echo "## Published images"
            echo
            echo "| Image | Tag | Digest |"
            echo "|-------|-----|--------|"
            while IFS= read -r image; do
              while IFS= read -r php; do
                dated="$(bin/release-tags.sh --image "$image" --php "$php" \
                  --kind immutable --dated-suffix "$DATED_SUFFIX" "${flag[@]}" | head -n1)"
                digest="$(docker buildx imagetools inspect "$dated" --format '{{.Manifest.Digest}}')"
                # shellcheck disable=SC2016  # the backticks are markdown code spans, not substitution
                printf '| %s | `%s` | `%s` |\n' "$image" "${dated##*:}" "$digest"
              done < <(bin/php-versions.sh "${flag[@]}")
            done < <(yq -r '.images | keys | .[]' config/images.yml)
            echo
            echo "Verify any of them: see the supply-chain section of the README."
            echo
            echo "### Active vulnerability suppressions"
            echo
            if grep -qEv '^\s*(#|$)' .trivyignore; then
              echo '```'
              grep -Ev '^\s*(#|$)' .trivyignore
              echo '```'
            else
              echo "None. The gate passed with no exceptions."
            fi
          } > /tmp/notes.md
          cat /tmp/notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          # Same channel resolution the repoint gate uses. A prerelease must NOT
          # become the repo's "Latest release": `gh release create` marks the
          # latest by default, so an rc would headline the homepage exactly like
          # the rolling :latest tag would have. --prerelease is GitHub's own
          # opt-out and keeps the shakedown quiet.
          IS_STABLE: ${{ needs.prepare.outputs.is_stable_release }}
        run: |
          set -euo pipefail
          prerelease_flag=()
          if [ "$IS_STABLE" != "true" ]; then
            prerelease_flag=(--prerelease)
          fi
          gh release create "$TAG" "${prerelease_flag[@]}" --generate-notes --notes-file /tmp/notes.md \
            || gh release edit "$TAG" "${prerelease_flag[@]}" --notes-file /tmp/notes.md
