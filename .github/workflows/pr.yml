name: pr

on:
  pull_request:

permissions:
  contents: read

# Consecutive pushes to a PR otherwise run overlapping full matrices; at M4's
# 36 legs that is the single largest avoidable CI cost.
concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      legs: ${{ steps.gen.outputs.legs }}
      count: ${{ steps.gen.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install the pinned yq
        run: |
          set -euo pipefail
          # config/images.yml decides the matrix, the image identity and the
          # budgets; the runner's preinstalled yq is a version nothing pinned.
          # Same reasoning as bin/lib/common.sh, which resolves it through this
          # fetcher for every script.
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          bin/fetch-tools.sh --dest "$HOME/.local/bin" yq

      - name: Resolve affected images and build the amd64 matrix
        id: gen
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          base="origin/${BASE_REF}"

          # affected.sh exits non-zero when it cannot resolve the base ref, and
          # this assignment propagates that under errexit. Both halves matter:
          # the script used to swallow a failed `git diff` and exit 0, so a
          # guard here alone reported "nothing to build" on a broken ref.
          affected_out="$(bin/affected.sh --base "$base")"

          images=()
          if [[ -n "$affected_out" ]]; then
            mapfile -t images <<<"$affected_out"
          fi

          if [[ ${#images[@]} -eq 0 ]]; then
            echo "::notice::no image is affected by this diff"
            echo 'legs={"include":[]}' >> "$GITHUB_OUTPUT"
            echo 'count=0' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # matrix.sh takes a single --image; run it per image and merge.
          # An image whose Dockerfile does not exist yet is skipped rather than
          # failing the leg: M1 ships only runtime, and M2/M3 pick their images
          # up here simply by adding the file.
          merged='{"include":[]}'
          for img in "${images[@]}"; do
            df="$(IMG="$img" yq -r '.images[strenv(IMG)].dockerfile' config/images.yml)"
            if [[ ! -f "$df" ]]; then
              echo "::notice::skipping $img - $df does not exist yet"
              continue
            fi
            leg="$(bin/matrix.sh --image "$img" --platform linux/amd64)"
            merged="$(jq -c --argjson a "$merged" --argjson b "$leg" \
              '{include: ($a.include + $b.include)}' <<<'{}')"
          done
          {
            echo "legs=$merged"
            echo "count=$(jq '.include | length' <<<"$merged")"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    if: ${{ needs.matrix.outputs.count != '0' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.legs) }}
    uses: ./.github/workflows/build.yml
    with:
      php: ${{ matrix.php }}
      image: ${{ matrix.image }}
      platforms: ${{ matrix.platform }}
      push: false
      cache_mode: max
      dockerfile: ${{ matrix.dockerfile }}
      debian: ${{ matrix.debian }}
      structure_test: true

  # A stable, always-present check to gate branch protection on. It succeeds
  # only if every matrix leg succeeded (or if there were legitimately zero legs,
  # e.g. a docs-only PR). Branch protection requires THIS name - never the
  # volatile per-leg names.
  pr-required:
    name: pr-required
    needs: [ matrix, build ]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    env:
      # Passed through env: rather than interpolated into the run: body, per the
      # repo's H1 rule (no ${{ }} in shell). These are trusted result enums, but
      # the standard is blunt on purpose - honour it rather than carve exceptions.
      MATRIX_RESULT: ${{ needs.matrix.result }}
      BUILD_RESULT: ${{ needs.build.result }}
    steps:
      - name: Verify upstream jobs did not fail
        run: |
          set -euo pipefail
          # result is one of: success, failure, cancelled, skipped.
          # 'build' is skipped when there were zero affected legs - a pass, not a
          # failure. Anything actually failing/cancelled blocks the merge.
          echo "matrix=$MATRIX_RESULT build=$BUILD_RESULT"
          if [ "$MATRIX_RESULT" != "success" ]; then
            echo "matrix job did not succeed"; exit 1
          fi
          case "$BUILD_RESULT" in
            success|skipped) : ;;
            *) echo "build matrix did not succeed"; exit 1 ;;
          esac
