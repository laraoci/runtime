name: pr

on:
  pull_request:

permissions:
  contents: read

# Consecutive pushes to a PR otherwise run overlapping full matrices; at M4's
# 36 legs that is the single largest avoidable CI cost.
concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      legs: ${{ steps.gen.outputs.legs }}
      count: ${{ steps.gen.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install yq (mikefarah) and jq
        run: |
          sudo curl -fsSL https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64 \
            -o /usr/local/bin/yq && sudo chmod +x /usr/local/bin/yq
          sudo apt-get update && sudo apt-get install -y jq

      - name: Resolve affected images and build the amd64 matrix
        id: gen
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          base="origin/${BASE_REF}"
          mapfile -t images < <(bin/affected.sh --base "$base")
          if [[ ${#images[@]} -eq 0 ]]; then
            echo 'legs={"include":[]}' >> "$GITHUB_OUTPUT"
            echo 'count=0' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # matrix.sh takes a single --image; run it per image and merge.
          # An image whose Dockerfile does not exist yet is skipped rather than
          # failing the leg: M1 ships only runtime, and M2/M3 pick their images
          # up here simply by adding the file.
          merged='{"include":[]}'
          for img in "${images[@]}"; do
            df="$(yq -r ".images.\"$img\".dockerfile" config/images.yml)"
            if [[ ! -f "$df" ]]; then
              echo "::notice::skipping $img - $df does not exist yet"
              continue
            fi
            leg="$(bin/matrix.sh --image "$img" --platform linux/amd64)"
            merged="$(jq -c --argjson a "$merged" --argjson b "$leg" \
              '{include: ($a.include + $b.include)}' <<<'{}')"
          done
          {
            echo "legs=$merged"
            echo "count=$(jq '.include | length' <<<"$merged")"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    if: ${{ needs.matrix.outputs.count != '0' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.legs) }}
    uses: ./.github/workflows/build.yml
    with:
      php: ${{ matrix.php }}
      image: ${{ matrix.image }}
      platforms: ${{ matrix.platform }}
      push: false
      cache_mode: max
      dockerfile: ${{ matrix.dockerfile }}
      structure_test: true
